[componentInstances:cComponentManager]
instance[dataMemory].type=cDataMemory
printLevelStats=0
\{opensmile_stock_config/shared/standard_wave_input.conf.inc}
\{opensmile_stock_config/gemaps/v01b/GeMAPSv01b_core.lld.conf.inc}

[waveIn:cWaveSource]
monoMixdown=0

[gemapsv01b_pitchJitter:cPitchJitter]
periodOutputFile=\cm[periodfile:accepted-period samples for diagnostics]
refinedF0=1
sourceQualityMean=1
sourceQualityRange=1
usePeakToPeakPeriodLength=0
useBrokenJitterThresh=0
jitterLocalEnv=0
jitterDDPEnv=0
onlyVoiced=0

[componentInstances:cComponentManager]
instance[outPitchFinal].type=cCsvSink
instance[outPitchBeforeEnergy].type=cCsvSink
instance[outShs].type=cCsvSink
instance[outJitter].type=cCsvSink
instance[outHarmonics].type=cCsvSink
instance[outEnergy].type=cCsvSink

[outPitchFinal:cCsvSink]
reader.dmLevel=gemapsv01b_logPitch
filename=\cm[outPitchFinal:diagnostic CSV]
append=0
timestamp=1
number=1
frameLength=1
printHeader=1

[outPitchBeforeEnergy:cCsvSink]
